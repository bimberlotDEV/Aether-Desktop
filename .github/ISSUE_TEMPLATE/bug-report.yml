name: Beta bug report
description: Report a reproducible Aether defect without sharing private workspace data.
title: '[Bug]: '
labels: [bug, beta]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing Aether. Never attach an Aether database, backup, API key, note, prompt, private filename/path, personal document, or full log. Use private vulnerability reporting for security issues.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal content, private filenames/paths and identifying information.
          required: true
        - label: This is not a security vulnerability or sensitive exploit report.
          required: true
  - type: input
    id: version
    attributes:
      label: Aether version
      description: Copy only the appVersion value from Settings → Sanitized diagnostics.
      placeholder: 0.5.0
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11 x64
        - Windows 10 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use neutral sample names. Do not paste real workspace content.
      placeholder: |
        1. Open …
        2. Choose …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostic report
      description: Optional. Paste only the exact preview shown by Aether; inspect it again before submitting.
      render: json
  - type: dropdown
    id: data_risk
    attributes:
      label: Data or security impact
      options:
        - None observed
        - Work blocked, no data loss
        - Possible data loss or corruption (describe without content)
        - Possible secret/privacy exposure (stop and use private security reporting)
    validations:
      required: true
