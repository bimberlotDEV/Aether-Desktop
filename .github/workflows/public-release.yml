name: Public Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact numeric Aether version already committed on master
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-windows-release
  cancel-in-progress: false

jobs:
  signed-draft:
    name: Signed Windows draft release
    runs-on: windows-latest
    timeout-minutes: 60
    environment: public-release
    permissions:
      contents: write
    steps:
      - name: Require master dispatch
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/master') {
            throw 'Public releases must be dispatched from master.'
          }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - name: Require owner-controlled trust inputs
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AETHER_UPDATER_PUBLIC_KEY: ${{ secrets.AETHER_UPDATER_PUBLIC_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
        run: |
          $required = @(
            'TAURI_SIGNING_PRIVATE_KEY',
            'TAURI_SIGNING_PRIVATE_KEY_PASSWORD',
            'AETHER_UPDATER_PUBLIC_KEY',
            'AZURE_CLIENT_ID',
            'AZURE_CLIENT_SECRET',
            'AZURE_TENANT_ID',
            'AZURE_ARTIFACT_SIGNING_ENDPOINT',
            'AZURE_ARTIFACT_SIGNING_ACCOUNT',
            'AZURE_ARTIFACT_SIGNING_PROFILE'
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required protected release input '$name' is missing."
            }
          }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact release identity
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          $master = git rev-parse origin/master
          if ($head -ne $master) { throw 'Release commit is not the current origin/master.' }
          $tag = 'aether-v${{ inputs.version }}'
          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          $tagCheck = $LASTEXITCODE
          if ($tagCheck -eq 0) { throw "Release tag '$tag' already exists." }
          if ($tagCheck -ne 2) { throw 'Could not verify that the release tag is unused.' }
          ./scripts/verify-release-inputs.ps1 -Version '${{ inputs.version }}'

      - name: Frontend quality and security
        run: |
          pnpm check
          pnpm build
          pnpm audit --audit-level high

      - name: Native quality
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features

      - name: Install pinned Windows signing client
        run: |
          cargo install artifact-signing-cli --version 0.11.0 --locked
          cargo install rsign2 --version 0.6.6 --locked

      - name: Generate protected release configuration
        shell: pwsh
        env:
          AETHER_UPDATER_PUBLIC_KEY: ${{ secrets.AETHER_UPDATER_PUBLIC_KEY }}
        run: ./scripts/prepare-release-config.ps1

      - name: Build signed installers and updater draft
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
        with:
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.release.generated.json --bundles nsis,msi
          tagName: aether-v${{ inputs.version }}
          releaseName: Aether ${{ inputs.version }}
          releaseBody: Signed Aether Windows release candidate. Publish only after completing docs/release-runbook.md.
          releaseDraft: true
          prerelease: false
          uploadUpdaterSignatures: true
          uploadUpdaterJson: true

      - name: Verify Authenticode and updater outputs
        shell: pwsh
        env:
          AETHER_UPDATER_PUBLIC_KEY: ${{ secrets.AETHER_UPDATER_PUBLIC_KEY }}
        run: |
          $installers = Get-ChildItem src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in @('.exe', '.msi') }
          if (-not $installers) { throw 'No Windows installers were generated.' }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode verification failed for $($installer.Name): $($signature.Status)"
            }
          }
          $updaterSignatures = Get-ChildItem src-tauri/target/release/bundle -Recurse -File -Filter '*.sig'
          if (-not $updaterSignatures) { throw 'No updater signature artifacts were generated.' }
          foreach ($updaterSignature in $updaterSignatures) {
            $artifact = $updaterSignature.FullName.Substring(0, $updaterSignature.FullName.Length - 4)
            ./scripts/verify-updater-signature.ps1 -ArtifactPath $artifact -SignaturePath $updaterSignature.FullName
          }

      - name: Refuse generated or sensitive tracked files
        shell: pwsh
        run: |
          $tracked = git ls-files
          if ($tracked -match 'tauri\.release\.generated\.json|\.env|\.pfx$|\.key$|\.aether-backup|\.db$') {
            throw 'A sensitive or generated release file is tracked.'
          }
